name: Generate README

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - 'scripts/build-readme.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build README and SVG assets
        run: node scripts/build-readme.mjs

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          git diff --cached --quiet || git commit -m "chore: rebuild README from readme.source.md"
          git push

    </text>

    <!-- Left Panel: Technical Skills -->
    <rect x="36" y="418" width="470" height="154" rx="10" fill="rgba(10,15,22,0.82)" stroke="#1f352e" stroke-width="1" />
    <text x="54" y="442" fill="#38bdf8" font-size="13" font-weight="700" class="mono">[technical_skills]</text>
    <text x="54" y="466" font-size="12" class="mono"><tspan fill="#39d353">power_bi    </tspan><tspan fill="#8b949e">= </tspan><tspan fill="#e6edf3">["Dashboarding", "DAX", "Data Viz"]</tspan></text>
    <text x="54" y="488" font-size="12" class="mono"><tspan fill="#39d353">sql         </tspan><tspan fill="#8b949e">= </tspan><tspan fill="#e6edf3">["T-SQL", "3NF", "CTEs", "Windows"]</tspan></text>

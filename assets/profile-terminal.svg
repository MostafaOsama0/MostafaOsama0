    <text x="315" y="294" font-size="12.5" class="mono"><tspan fill="#38bdf8" font-weight="700">Focus     </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">ETL, Data Modeling, KPIs, Dashboards</tspan></text>
    <text x="315" y="314" font-size="12.5" class="mono"><tspan fill="#38bdf8" font-weight="700">Toolkit   </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">Power BI • SQL • Python • Power Query • Excel</tspan></text>
    <text x="315" y="334" font-size="12.5" class="mono"><tspan fill="#38bdf8" font-weight="700">Education </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">B.Sc. Computer Science @ BNU (Cairo, Egypt)</tspan></text>

    <line x1="36" y1="378" x2="864" y2="378" stroke="#1f2d2a" stroke-width="1" />


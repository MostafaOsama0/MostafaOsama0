    <text x="36" y="618" font-size="13.5" class="mono">
      <tspan fill="#39d353" font-weight="700">mostafa@cairo</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">ls -lh ./featured-projects/</tspan>
    </text>


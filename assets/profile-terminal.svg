    <text x="54" y="532" font-size="12" class="mono"><tspan fill="#39d353">power_query </tspan><tspan fill="#8b949e">= </tspan><tspan fill="#e6edf3">["ETL", "Cleaning", "Transform"]</tspan></text>
    <text x="54" y="554" font-size="12" class="mono"><tspan fill="#39d353">excel       </tspan><tspan fill="#8b949e">= </tspan><tspan fill="#e6edf3">["Pivot Tables", "VLOOKUP", "Formulas"]</tspan></text>

    <!-- Right Panel: Core Skills -->
    <rect x="524" y="418" width="340" height="154" rx="10" fill="rgba(10,15,22,0.82)" stroke="#1f352e" stroke-width="1" />
    <text x="542" y="442" fill="#39d353" font-size="13" font-weight="700" class="mono">[core_skills]</text>
    <text x="542" y="466" font-size="12.5" class="mono"><tspan fill="#38bdf8">▸ </tspan><tspan fill="#e6edf3">Data Storytelling</tspan></text>
    <text x="542" y="488" font-size="12.5" class="mono"><tspan fill="#38bdf8">▸ </tspan><tspan fill="#e6edf3">Analytical Thinking</tspan></text>
    <text x="542" y="510" font-size="12.5" class="mono"><tspan fill="#38bdf8">▸ </tspan><tspan fill="#e6edf3">Problem Solving</tspan></text>
    <text x="542" y="532" font-size="12.5" class="mono"><tspan fill="#38bdf8">▸ </tspan><tspan fill="#e6edf3">Communication Skills</tspan></text>
    <text x="542" y="554" font-size="12.5" class="mono"><tspan fill="#38bdf8">▸ </tspan><tspan fill="#e6edf3">Team Collaboration</tspan></text>

    <line x1="36" y1="592" x2="864" y2="592" stroke="#1f2d2a" stroke-width="1" />

